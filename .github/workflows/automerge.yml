name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@6ffac07db8fd93257bda7282c797b1d63fdef596 # v2.8.1
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
