name: ai-review

# Label a ready PR ai:pr-agent for one review.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    uses: JakobMelchard/.github/.github/workflows/ai-review.yml@6ffac07db8fd93257bda7282c797b1d63fdef596 # v2.8.1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
