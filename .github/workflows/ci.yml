name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/node.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    with:
      install-cmd: npm install   # switch to npm ci once package-lock.json is committed
      check-cmd: npm run typecheck
      test-cmd: npm test

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    with:
      skip: eslint   # needs node_modules; node.yml lints
